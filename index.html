<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=6">
<title>نرخەکانی تەکسی شاری سلاڤا</title>
<meta name="description" content="لیستی نرخەکانی تەکسی شاری سلاڤا">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f2c230;
    font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  header {
    width: 100%;
    padding: 14px 12px;
    text-align: center;
    background: #1b1b1b;
    color: #f2c230;
    font-size: 20px;
    font-weight: 700;
  }
  main { width: 100%; padding: 10px; }
  img {
    display: block;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  p.hint {
    margin: 10px auto 24px;
    text-align: center;
    font-size: 14px;
    color: #4a3a00;
  }
</style>
</head>
<body>
  <header>نرخەکانی تەکسی شاری سلاڤا</header>
  <main>
    <img src="prices.jpg" alt="لیستی نرخەکانی تەکسی شاری سلاڤا">
    <p class="hint">بۆ گەورەکردن، بە دوو پەنجە زووم بکە</p>
  </main>
</body>
</html>
